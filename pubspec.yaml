name: rencloud_flutter
description: RenCloud Service Catalog & Pricing Showcase App
publish_to: 'none'
version: 1.6.7+80

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  path_provider: ^2.1.0
  open_filex: ^4.3.0
  web_socket_channel: ^2.4.0
  local_auth: ^2.3.0
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
