name: rencloud_flutter
description: RenCloud Service Catalog & Pricing Showcase App
publish_to: 'none'
version: 1.9.1+270

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  dio: ^5.7.0
  path_provider: ^2.1.0
  open_filex: ^4.3.0
  web_socket_channel: ^2.4.0
  local_auth: ^2.3.0
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.0
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#090D16"
  adaptive_icon_foreground: "assets/images/logo_adaptive_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
